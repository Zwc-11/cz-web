<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Caesar Zhou</title>
    <meta name="description" content="Computer Science &amp; Finance at Waterloo. AI Adoption &amp; Deployment Engineering Intern at ecobee. Building TakeOne, an OpenAI-supported AI robot film studio." />
    <meta name="theme-color" content="#faf8f4" />
    <meta property="og:title" content="Caesar Zhou" />
    <meta property="og:description" content="Computer Science &amp; Finance at Waterloo. AI Adoption &amp; Deployment Engineering Intern at ecobee. Building TakeOne, an OpenAI-supported AI robot film studio." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://caesarzhou.com" />
    <meta property="og:image" content="https://caesarzhou.com/photos/htn-2026-finals-demo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/cz-icon.svg" type="image/svg+xml" />
    <link rel="alternate" type="text/markdown" href="llms.txt" title="Site as Markdown" />
    <!-- The static copy in #root is for agents and crawlers; React replaces it on load. -->
    <style>.static-site { display: none; }</style>
    <noscript><style>.static-site { display: block; max-width: 680px; margin: 48px auto; padding: 0 24px; font: 16px/1.6 system-ui, sans-serif; }</style></noscript>
    <script>
      // Set the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('cz-theme')
        if (t !== 'dark' && t !== 'light') t = document.documentElement.getAttribute('data-theme')
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
